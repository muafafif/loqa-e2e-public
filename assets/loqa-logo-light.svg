<svg width="320" height="64" viewBox="0 0 320 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="l-lh" x1="18" y1="5" x2="28" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="l-rh" x1="18" y1="5" x2="53" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="l-cv" x1="18" y1="5" x2="41" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity=".9"/>
      <stop offset="100%" stop-color="white" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="l-sp" x1="18" y1="5" x2="46" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity=".4"/>
    </linearGradient>
    <filter id="l-f-sm"><feGaussianBlur stdDeviation=".6"/></filter>
    <!-- Wordmark gradient for light bg -->
    <linearGradient id="l-wm" x1="76" y1="8" x2="200" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!--
    Mark only (no bg box), cropped viewBox — scaled to 64px height
    Same coordinates as dark: A(18,5) B(46,12) C(52,33) D(41,56) E(14,51) F(8,27)
  -->
  <polygon points="18,5 8,27 14,51 41,56" fill="url(#l-lh)"/>
  <polygon points="18,5 46,12 52,33 41,56" fill="url(#l-rh)"/>

  <!-- Edges -->
  <line x1="8"  y1="27" x2="18" y2="5"  stroke="rgba(255,255,255,.35)" stroke-width=".7"/>
  <line x1="18" y1="5"  x2="46" y2="12" stroke="url(#l-sp)" stroke-width=".9"/>
  <line x1="46" y1="12" x2="52" y2="33" stroke="rgba(255,255,255,.2)"  stroke-width=".5"/>
  <line x1="52" y1="33" x2="41" y2="56" stroke="rgba(0,0,0,.08)" stroke-width=".4"/>
  <line x1="41" y1="56" x2="14" y2="51" stroke="rgba(0,0,0,.08)" stroke-width=".4"/>
  <line x1="14" y1="51" x2="8"  y2="27" stroke="rgba(0,0,0,.08)" stroke-width=".4"/>

  <!-- Cleave drop shadow (on light bg) -->
  <line x1="18.5" y1="5.5" x2="41.5" y2="56.5"
    stroke="rgba(0,0,0,.08)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cleave -->
  <line x1="18" y1="5" x2="41" y2="56"
    stroke="url(#l-cv)" stroke-width=".9" stroke-linecap="round"/>

  <!-- Drop shadow under mark -->
  <ellipse cx="29" cy="57" rx="12" ry="2" fill="#7c3aed" fill-opacity=".10" filter="url(#l-f-sm)"/>

  <!-- Apex A(18,5) -->
  <circle cx="18" cy="5" r="1.2" fill="white" fill-opacity=".9"/>

  <!-- Glint B(46,12) -->
  <g transform="translate(46,12)">
    <line x1="0" y1="-3.5" x2="0" y2="3.5" stroke="#7c3aed" stroke-width=".6" stroke-opacity=".8"/>
    <line x1="-3.5" y1="0" x2="3.5" y2="0" stroke="#7c3aed" stroke-width=".6" stroke-opacity=".8"/>
    <circle r=".8" fill="#7c3aed" fill-opacity=".9"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="47"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="42" font-weight="700" letter-spacing="-2.2"
    fill="url(#l-wm)">LOQA</text>
</svg>
