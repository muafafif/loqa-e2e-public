server {
    listen 3002;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browser calls backend directly on localhost:8001 (port exposed by docker-compose).
    # No proxy needed here — backend is accessed by the browser, not the container.

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
