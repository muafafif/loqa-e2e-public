name: Windows E2E Recording

# Manual-only so this does not consume Actions minutes on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-e2e-recording-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-business-frontend:
    name: LOQA Work frontend recording
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      DATA_DIR: ${{ runner.temp }}\loqa-work-data
      MODELS_DIR: ${{ runner.temp }}\loqa-models
      LOQA_E2E_LICENSE_BYPASS: "1"
      LOQA_E2E_CONNECTION_READY: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/business/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/business/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/business/backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 "uvicorn[standard]==0.30.6" pydantic==2.9.2 pydantic-settings==2.5.2 httpx==0.27.2 psutil>=6.0.0 python-jose==3.3.0 aiofiles==24.1.0 python-multipart==0.0.9

      - name: Seed business data
        working-directory: apps/business/backend
        run: |
          python -c "import app.e2e_main"
          python seed.py up

      - name: Install frontend dependencies
        working-directory: apps/business/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/business/frontend
        run: npx playwright install chromium

      - name: Start backend
        working-directory: apps/business/backend
        run: |
          Start-Process python -ArgumentList "-m", "uvicorn", "app.e2e_main:app", "--host", "127.0.0.1", "--port", "8001" -WorkingDirectory "${{ github.workspace }}\apps\business\backend" -NoNewWindow
          for ($i = 0; $i -lt 60; $i++) {
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:8001/health" | Out-Null
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          throw "Backend did not become ready"

      - name: Run Windows frontend E2E with video
        working-directory: apps/business/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3002
        run: npm run e2e:record

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loqa-work-windows-playwright-report
          path: apps/business/frontend/playwright-report/
          retention-days: 14

      - name: Upload Windows recording artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loqa-work-windows-recordings
          path: apps/business/frontend/test-results/
          retention-days: 14
