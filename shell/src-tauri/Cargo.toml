[package]
name = "knowledge-ai-shell"
version = "0.1.0"
description = "LOQA Launcher"
authors = []
license = ""
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = ["shell-open", "shell-execute", "path-all", "fs-read-file", "fs-write-file", "fs-create-dir", "http-request"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
